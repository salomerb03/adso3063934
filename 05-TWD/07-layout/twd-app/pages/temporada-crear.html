<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Nueva Temporada</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/temporadas.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="temp-form">

      <header class="temp-form__header">
        <a href="temporadas.html" class="btn-back-t"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="temp-form__title">NUEVA TEMPORADA</h2>
      </header>

      <div class="temp-form__avatar-wrapper">
        <div class="temp-form__avatar-placeholder">
          <i class="fa-solid fa-camera"></i>
          <span>Agregar imagen</span>
        </div>
      </div>

      <div class="temp-form__fields">

        <div class="tf-field">
          <label>Número</label>
          <div class="tf-input-wrap">
            <i class="fa-solid fa-hashtag tf-icon"></i>
            <input type="number" placeholder="Ingresa el número" />
          </div>
        </div>

        <div class="tf-field">
          <label>Título</label>
          <div class="tf-input-wrap">
            <i class="fa-solid fa-heading tf-icon"></i>
            <input type="text" placeholder="Ingresa el título" />
          </div>
        </div>

        <div class="tf-field">
          <label>Año</label>
          <div class="tf-input-wrap">
            <i class="fa-solid fa-calendar tf-icon"></i>
            <input type="number" placeholder="Ingresa el Año" />
          </div>
        </div>

        <div class="tf-field">
          <label>Episodios</label>
          <div class="tf-input-wrap">
            <i class="fa-solid fa-clapperboard tf-icon"></i>
            <input type="number" placeholder="Ingresa el número de episodios" />
          </div>
        </div>

        <div class="tf-field">
          <label>Protagonista</label>
          <div class="tf-input-wrap">
            <i class="fa-solid fa-user tf-icon"></i>
            <input type="text" placeholder="Ingresa el protagonista de la temporada" />
          </div>
        </div>

        <div class="tf-field">
          <label>Descripción</label>
          <textarea class="tf-textarea" placeholder="Ingresa una descripción" rows="4"></textarea>
        </div>

      </div>

      <div class="temp-form__footer">
        <a href="temporadas.html" class="btn-primary">GUARDAR</a>
      </div>

    </main>
  </div>
</body>
</html>
