<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Eliminar Ubicación</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/ubicaciones.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="ubic-eliminar">

      <header class="ubic-eliminar__header">
        <a href="ubicacion-detalle.html" class="btn-back-u"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="ubic-eliminar__title">ELIMINAR UBICACIÓN</h2>
      </header>

      <div class="ubic-eliminar__icon-wrap">
        <div class="ue-skull-ring">
          <i class="fa-solid fa-skull ue-skull"></i>
        </div>
      </div>

      <div class="ubic-eliminar__warning">
        <p>¿Estás seguro de que deseas<br>eliminar esta ubicación?<br>
        <span>Esta acción no se puede deshacer</span></p>
      </div>

      <div class="ubic-eliminar__preview">
        <div class="ubics__thumb ubics__thumb--alexandria ue-preview-thumb"></div>
        <div class="ubics__info">
          <span class="ubics__name">Alexandria</span>
          <small class="ubics__meta">Asentamiento · Activo</small>
        </div>
        <i class="fa-solid fa-chevron-right ubics__chevron"></i>
      </div>

      <div class="ubic-eliminar__actions">
        <a href="ubicaciones.html" class="btn-primary ue-btn-delete">ELIMINAR</a>
        <a href="ubicacion-detalle.html" class="btn-outline">CANCELAR</a>
      </div>

    </main>
  </div>
</body>
</html>
