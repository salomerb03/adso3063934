<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Eliminar Caminante</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/tipos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="tipo-eliminar">

      <header class="tipo-eliminar__header">
        <a href="tipo-detalle.html" class="btn-back-tp"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="tipo-eliminar__title">ELIMINAR CAMINANTE</h2>
      </header>

      <div class="tipo-eliminar__icon-wrap">
        <div class="tpe-skull-ring">
          <i class="fa-solid fa-skull tpe-skull"></i>
        </div>
      </div>

      <div class="tipo-eliminar__warning">
        <p>¿Estás seguro de que deseas<br>eliminar este caminante?<br>
        <span>Esta acción no se puede deshacer</span></p>
      </div>

      <div class="tipo-eliminar__preview">
        <div class="tipos__thumb tipos__thumb--horda tpe-preview-thumb"></div>
        <div class="tipos__info">
          <span class="tipos__name">Caminante común</span>
          <small class="tipos__meta">Nivel 1 · Lento y Torpe</small>
        </div>
        <i class="fa-solid fa-chevron-right tipos__chevron"></i>
      </div>

      <div class="tipo-eliminar__actions">
        <a href="tipos-zombies.html" class="btn-primary tpe-btn-delete">ELIMINAR</a>
        <a href="tipo-detalle.html" class="btn-outline">CANCELAR</a>
      </div>

    </main>
  </div>
</body>
</html>
