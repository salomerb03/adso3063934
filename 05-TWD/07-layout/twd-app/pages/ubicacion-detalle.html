<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Detalle Ubicación</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/ubicaciones.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="ubic-detalle">

      <div class="ubic-detalle__hero">
        <div class="ubic-detalle__hero-img ubic-detalle__hero-img--alexandria"></div>
        <div class="ubic-detalle__hero-overlay"></div>
        <a href="ubicaciones.html" class="ud-back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="ubic-detalle__hero-name">
          <h1>Alexandria</h1>
          <span class="ud-status ud-status--activo">
            <i class="fa-solid fa-circle" style="font-size:0.5rem"></i> Activo
          </span>
        </div>
      </div>

      <div class="ubic-detalle__content">

        <div class="ud-chips">
          <span class="ud-chip"><i class="fa-solid fa-shield-halved"></i> TIPO</span>
          <span class="ud-chip ud-chip--val">Asentamiento</span>
        </div>
        <div class="ud-chips">
          <span class="ud-chip"><i class="fa-solid fa-location-dot"></i> ESTADO</span>
          <span class="ud-chip ud-chip--val" style="color:#5cb85c">Activo</span>
        </div>

        <div class="ud-section">
          <h3 class="ud-section-title">DESCRIPCIÓN</h3>
          <p class="ud-desc">
            Comunidad amurallada en las afueras de Washington D.C. Uno de los asentamientos
            más seguros del apocalipsis zombie. Sus altos muros de acero y su comunidad
            organizada la convierten en la base principal del grupo de Rick Grimes.
          </p>
        </div>

        <div class="ud-actions">
          <a href="ubicacion-editar.html" class="ud-action-btn ud-action-btn--edit"><i class="fa-solid fa-pen"></i></a>
          <a href="ubicacion-eliminar.html" class="ud-action-btn ud-action-btn--delete"><i class="fa-solid fa-trash"></i></a>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
