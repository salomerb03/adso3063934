<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Eliminar Personaje</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/personajes.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="eliminar">

      <!-- HEADER -->
      <header class="eliminar__header">
        <a href="personaje-detalle.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="eliminar__title">ELIMINAR PERSONAJE</h2>
      </header>

      <!-- SKULL ICON -->
      <div class="eliminar__icon-wrap">
        <div class="eliminar__skull-ring">
          <i class="fa-solid fa-skull eliminar__skull"></i>
        </div>
      </div>

      <!-- WARNING TEXT -->
      <div class="eliminar__warning">
        <p>¿Estás seguro de que deseas<br>eliminar este personaje?<br>
        <span>Esta acción no se puede deshacer</span></p>
      </div>

      <!-- CHARACTER PREVIEW -->
      <div class="eliminar__preview">
        <div class="pj-avatar pj-avatar--rick eliminar__preview-avatar"></div>
        <div class="pj-info">
          <span class="pj-name">Rick Grimes</span>
          <small class="pj-role">Líder · Grupo Original</small>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="eliminar__actions">
        <a href="personajes.html" class="btn-primary eliminar__btn-delete">ELIMINAR</a>
        <a href="personaje-detalle.html" class="btn-outline">CANCELAR</a>
      </div>

    </main>
  </div>
</body>
</html>
