<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Recuperar Contraseña</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/recuperar.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="phone-frame">
    <main class="recuperar">

      <!-- header -->
      <header class="recuperar__header">
        <a href="login.html" class="btn-back" aria-label="Volver">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
      </header>

      <!-- cuerpo -->
      <section class="recuperar__body">

        <!-- Logo mano -->
        <img
          class="recuperar__logo"
          src="../assets/img/logo-mano.png"
          alt="Logo"
        />

        <!-- Título -->
        <div class="recuperar__title-wrapper">
          <h1 class="recuperar__title">Recuperacion<br>Contraseña</h1>
        </div>

        <!-- Imagen del sobre -->
        <img
          class="recuperar__sobre"
          src="../assets/img/icono-sobre.png"
          alt="Sobre de correo"
        />

        <!-- Descripción -->
        <p class="recuperar__description">
          Ingrese su correo electrónico y le enviaremos instrucciones
          para reestablecer la contraseña
        </p>

        <!-- Formulario -->
        <form class="recuperar__form" novalidate>

          <div class="input-group">
            <label for="email">Usuario o Email</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user input-icon"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Ingresa tu usuario o email"
                autocomplete="email"
              />
            </div>
          </div>

          <button type="submit" class="btn-primary" style="margin-top: var(--sp-xs);">
            Enviar Instrucciones
          </button>

          <a href="login.html" class="recuperar__back-link">
            Volver a iniciar sesión
          </a>

        </form>

      </section>
    </main>
  </div>

</body>
</html>
