<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Eliminar Temporada</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/temporadas.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="temp-eliminar">

      <header class="temp-eliminar__header">
        <a href="temporada-detalle.html" class="btn-back-t"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="temp-eliminar__title">ELIMINAR TEMPORADA</h2>
      </header>

      <div class="temp-eliminar__icon-wrap">
        <div class="te-skull-ring">
          <i class="fa-solid fa-skull te-skull"></i>
        </div>
      </div>

      <div class="temp-eliminar__warning">
        <p>¿Estás seguro de que deseas<br>eliminar esta temporada?<br>
        <span>Esta acción no se puede deshacer</span></p>
      </div>

      <div class="temp-eliminar__preview">
        <div class="temps__thumb temps__thumb--1 te-preview-thumb"></div>
        <div class="temps__info">
          <span class="temps__name">Temp. 1</span>
          <small class="temps__meta">Rick Grimes · 2010 · 6 Episodios</small>
        </div>
        <i class="fa-solid fa-chevron-right temps__chevron"></i>
      </div>

      <div class="temp-eliminar__actions">
        <a href="temporadas.html" class="btn-primary te-btn-delete">ELIMINAR</a>
        <a href="temporada-detalle.html" class="btn-outline">CANCELAR</a>
      </div>

    </main>
  </div>
</body>
</html>
