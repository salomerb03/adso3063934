<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Walking Dead — Nuevo Personaje</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/personajes.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="phone-frame">
    <main class="form-page">

      <!-- HEADER -->
      <header class="form-page__header">
        <a href="personajes.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="form-page__title">NUEVO PERSONAJE</h2>
      </header>

      <!-- AVATAR PICKER -->
      <div class="form-page__avatar-wrapper">
        <div class="form-page__avatar-placeholder">
          <i class="fa-solid fa-camera"></i>
          <span>Agregar imagen</span>
        </div>
      </div>

      <!-- FORM FIELDS -->
      <div class="form-page__fields">

        <div class="form-field">
          <label>Nombre</label>
          <div class="form-field__input-wrap">
            <i class="fa-solid fa-user form-field__icon"></i>
            <input type="text" placeholder="Ingresa tu nombre" />
          </div>
        </div>

        <div class="form-field">
          <label>Rol</label>
          <div class="form-field__input-wrap">
            <i class="fa-solid fa-shield form-field__icon"></i>
            <input type="text" placeholder="Ingresa el Rol" />
          </div>
        </div>

        <div class="form-field">
          <label>Grupo</label>
          <div class="form-field__input-wrap">
            <i class="fa-solid fa-users form-field__icon"></i>
            <input type="text" placeholder="Ingresa el Grupo" />
          </div>
        </div>

        <div class="form-field">
          <label>Temporada Aparición</label>
          <div class="form-field__select-wrap">
            <select>
              <option value="" disabled selected>Seleccionar Temporada</option>
              <option>Temporada 1</option>
              <option>Temporada 2</option>
              <option>Temporada 3</option>
              <option>Temporada 4</option>
              <option>Temporada 5</option>
              <option>Temporada 6</option>
              <option>Temporada 7</option>
              <option>Temporada 8</option>
              <option>Temporada 9</option>
              <option>Temporada 10</option>
              <option>Temporada 11</option>
            </select>
            <i class="fa-solid fa-chevron-down form-field__select-arrow"></i>
          </div>
        </div>

        <div class="form-field">
          <label>Estado</label>
          <div class="form-field__select-wrap">
            <select>
              <option value="" disabled selected>Seleccionar Estado</option>
              <option>Vivo</option>
              <option>Muerto</option>
              <option>Desconocido</option>
            </select>
            <i class="fa-solid fa-chevron-down form-field__select-arrow"></i>
          </div>
        </div>

        <div class="form-field">
          <label>Ubicación</label>
          <div class="form-field__select-wrap">
            <select>
              <option value="" disabled selected>Seleccionar Ubicación</option>
              <option>Alexandria</option>
              <option>Hilltop</option>
              <option>The Kingdom</option>
              <option>Oceanside</option>
              <option>The Sanctuary</option>
            </select>
            <i class="fa-solid fa-chevron-down form-field__select-arrow"></i>
          </div>
        </div>

        <!-- TOGGLE -->
        <div class="form-field form-field--toggle">
          <span>¿Convertido en Caminante?</span>
          <label class="toggle-switch">
            <input type="checkbox" />
            <span class="toggle-slider"></span>
          </label>
        </div>

      </div>

      <!-- SAVE BUTTON -->
      <div class="form-page__footer">
        <a href="personajes.html" class="btn-primary">GUARDAR</a>
      </div>

    </main>
  </div>
</body>
</html>
